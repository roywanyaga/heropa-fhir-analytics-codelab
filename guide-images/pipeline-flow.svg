<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-label="Data flows from the FHIR server through FHIR Data Pipes into Postgres tables and then to the dashboard">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1b1b1b; }
    .t { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; fill: #555; }
    .tab { font-size: 12px; font-weight: 700; fill: #fff; }
    .box { fill: #fff; stroke: #cfcfca; stroke-width: 1.5; }
    .arrow { stroke: #777; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs>
  <rect width="920" height="300" fill="#fcfcfb"/>

  <rect class="box" x="20" y="70" width="190" height="130" rx="12"/>
  <rect x="20" y="70" width="190" height="6" rx="3" fill="#2a78d6"/>
  <text class="t" x="115" y="108" text-anchor="middle">FHIR server</text>
  <text class="s" x="115" y="130" text-anchor="middle">HAPI FHIR</text>
  <text class="s" x="115" y="152" text-anchor="middle">Patient, Encounter,</text>
  <text class="s" x="115" y="170" text-anchor="middle">Immunization ... as JSON</text>

  <rect class="box" x="265" y="70" width="190" height="130" rx="12"/>
  <rect x="265" y="70" width="190" height="6" rx="3" fill="#eb6834"/>
  <text class="t" x="360" y="108" text-anchor="middle">FHIR Data Pipes</text>
  <text class="s" x="360" y="130" text-anchor="middle">reads every resource</text>
  <text class="s" x="360" y="152" text-anchor="middle">applies the</text>
  <text class="s" x="360" y="170" text-anchor="middle">ViewDefinitions</text>

  <rect class="box" x="510" y="70" width="190" height="130" rx="12"/>
  <rect x="510" y="70" width="190" height="6" rx="3" fill="#1baf7a"/>
  <text class="t" x="605" y="108" text-anchor="middle">Flat tables</text>
  <text class="s" x="605" y="130" text-anchor="middle">Postgres, analytics DB</text>
  <text class="s" x="605" y="152" text-anchor="middle">patient_flat,</text>
  <text class="s" x="605" y="170" text-anchor="middle">encounter_flat ...</text>

  <rect class="box" x="755" y="70" width="145" height="130" rx="12"/>
  <rect x="755" y="70" width="145" height="6" rx="3" fill="#eda100"/>
  <text class="t" x="827" y="108" text-anchor="middle">Dashboard</text>
  <text class="s" x="827" y="130" text-anchor="middle">Observable</text>
  <text class="s" x="827" y="152" text-anchor="middle">Framework runs</text>
  <text class="s" x="827" y="170" text-anchor="middle">SQL, draws charts</text>

  <path class="arrow" d="M212 135H262"/>
  <path class="arrow" d="M457 135H507"/>
  <path class="arrow" d="M702 135H752"/>

  <rect x="20" y="222" width="190" height="26" rx="13" fill="#2a78d6"/>
  <text class="tab" x="115" y="239" text-anchor="middle">Tab 2: FHIR server</text>
  <rect x="265" y="222" width="190" height="26" rx="13" fill="#eb6834"/>
  <text class="tab" x="360" y="239" text-anchor="middle">Tab 3: Pipelines</text>
  <rect x="755" y="222" width="145" height="26" rx="13" fill="#b07a00"/>
  <text class="tab" x="827" y="239" text-anchor="middle">Tab 4: Dashboard</text>

  <rect x="265" y="14" width="435" height="34" rx="17" fill="#f1f0ec" stroke="#cfcfca"/>
  <text class="s" x="482" y="36" text-anchor="middle">Tab 1: the Editor holds the ViewDefinitions and the dashboard code</text>
  <path d="M360 48V68" stroke="#cfcfca" stroke-width="2"/>
  <path d="M605 48V68" stroke="#cfcfca" stroke-width="2"/>
  <text class="s" x="460" y="278" text-anchor="middle">You change the ViewDefinitions and the dashboard queries. The data moves from left to right.</text>
</svg>
