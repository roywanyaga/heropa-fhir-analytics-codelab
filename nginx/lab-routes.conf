# The routes of the analytics lab, shared by the HTTPS front and the plain HTTP
# front used for local tests. It is included inside a server block.

absolute_redirect off;

# --- start page ----------------------------------------------------------
root /srv/www;
index index.html;

location = / {
    add_header Cache-Control "no-cache";
}

# The QR code on the start page is drawn again on every run of lab-init.sh.
location /qr/ {
    add_header Cache-Control "no-cache";
}

# --- the editor ----------------------------------------------------------
# code-server works under a path as long as the prefix is stripped. The
# upstream is a variable so nginx asks Docker's DNS on each request and
# survives a recreated workspace container.
location = /ide {
    return 302 /ide/;
}

location /ide/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $workspace http://workspace:8080;
    rewrite ^/ide/(.*)$ /$1 break;
    proxy_pass $workspace;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding   gzip;
    proxy_read_timeout  1d;
    proxy_send_timeout  1d;
    proxy_buffering     off;
}

# --- the dashboard -------------------------------------------------------
# The static site that Observable Framework builds after every save. Its
# pages use relative links, so it works under this path.
location = /dashboard {
    return 302 /dashboard/;
}

location /dashboard/ {
    alias /srv/home/lab/dashboard/dist/;
    index index.html;
    add_header Cache-Control "no-cache";
    gzip on;
    gzip_types application/javascript application/json text/css text/csv image/svg+xml;
    error_page 403 404 /building.html;
}

# --- the FHIR server, read only ------------------------------------------
# For looking at what the pipeline reads. Writes are refused.
location /fhir/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hapi http://hapi-fhir:8080;
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass $hapi;
    proxy_set_header Host $http_host;
    proxy_read_timeout 120s;
}

# --- build status and logs -----------------------------------------------
location = /app-status.json {
    alias /srv/home/.codelab/status.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}

location = /build.log {
    alias /srv/home/build.log;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store";
}

location = /buildlog {
    return 302 /buildlog/;
}

location /buildlog/ {
    add_header Cache-Control "no-cache";
}

location = /preview {
    return 302 /preview/;
}

location /preview/ {
    add_header Cache-Control "no-cache";
}

location = /building.html {
    add_header Cache-Control "no-cache";
}
